<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bismillah Traders Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1419; color: #fff; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 20px 30px; border-bottom: 2px solid #e94560; }
        .header h1 { color: #e94560; font-size: 28px; }
        .header p { color: #8899a6; margin-top: 5px; }
        .last-updated { float: right; color: #8899a6; font-size: 12px; }
        .container { padding: 20px 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; border-radius: 12px; padding: 20px; border-left: 4px solid #e94560; }
        .stat-card.sales { border-color: #00d9ff; }
        .stat-card.tax { border-color: #ff6b6b; }
        .stat-card.orders { border-color: #4ecdc4; }
        .stat-card.stock { border-color: #ffe66d; }
        .stat-card h3 { color: #8899a6; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .stat-card .change { font-size: 14px; }
        .positive { color: #4ecdc4; }
        .negative { color: #ff6b6b; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .chart-card { background: #1a1a2e; border-radius: 12px; padding: 20px; }
        .chart-card h3 { margin-bottom: 15px; color: #fff; }
        .table-card { background: #1a1a2e; border-radius: 12px; padding: 20px; }
        .table-card h3 { margin-bottom: 15px; color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #e94560; color: #8899a6; }
        td { padding: 12px; border-bottom: 1px solid #2d3748; }
        tr:hover { background: #16213e; }
        .loading { text-align: center; padding: 50px; color: #8899a6; }
        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <span class="last-updated">Last updated: <span id="lastUpdated">Loading...</span></span>
        <h1>📊 Bismillah Traders Dashboard</h1>
        <p>Kitchen Dunya — Sales, Tax & Inventory Summary</p>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card sales">
                <h3>Total Sales (YTD)</h3>
                <div class="value" id="totalSales">---</div>
            </div>
            <div class="stat-card orders">
                <h3>Total Orders</h3>
                <div class="value" id="totalOrders">---</div>
            </div>
            <div class="stat-card tax">
                <h3>Tax Liability</h3>
                <div class="value" id="taxLiability">---</div>
            </div>
            <div class="stat-card stock">
                <h3>Stock Items</h3>
                <div class="value" id="stockItems">---</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Monthly Sales</h3>
                <canvas id="salesChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Tax Breakdown</h3>
                <canvas id="taxChart"></canvas>
            </div>
        </div>

        <div class="table-card">
            <h3>Top Products</h3>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="topProducts">
                    <tr><td colspan="2" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch data from JSON files (updated by GitHub Actions)
        async function loadData() {
            try {
                const [salesRes, taxRes, stockRes] = await Promise.all([
                    fetch('data/sales.json'),
                    fetch('data/tax.json'),
                    fetch('data/stock.json')
                ]);
                
                const sales = await salesRes.json();
                const tax = await taxRes.json();
                const stock = await stockRes.json();
                
                // Update stats
                document.getElementById('totalSales').textContent = 'Rs. ' + sales.total.toLocaleString();
                document.getElementById('totalOrders').textContent = sales.orders.toLocaleString();
                document.getElementById('taxLiability').textContent = 'Rs. ' + tax.liability.toLocaleString();
                document.getElementById('stockItems').textContent = stock.totalItems.toLocaleString();
                document.getElementById('lastUpdated').textContent = new Date(sales.lastUpdated).toLocaleString();
                
                // Sales Chart
                const salesCtx = document.getElementById('salesChart').getContext('2d');
                new Chart(salesCtx, {
                    type: 'bar',
                    data: {
                        labels: sales.months,
                        datasets: [{
                            label: 'Sales (Rs.)',
                            data: sales.amounts,
                            backgroundColor: '#e94560',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        plugins: { legend: { labels: { color: '#fff' } } },
                        scales: {
                            x: { ticks: { color: '#8899a6' }, grid: { color: '#2d3748' } },
                            y: { ticks: { color: '#8899a6' }, grid: { color: '#2d3748' } }
                        }
                    }
                });
                
                // Tax Chart
                const taxCtx = document.getElementById('taxChart').getContext('2d');
                new Chart(taxCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Sales Tax', 'Tax Paid'],
                        datasets: [{
                            data: [tax.received, tax.paid],
                            backgroundColor: ['#ff6b6b', '#4ecdc4']
                        }]
                    },
                    options: {
                        plugins: { legend: { labels: { color: '#fff' } } }
                    }
                });
                
                // Top Products
                const productsHtml = stock.topProducts.slice(0, 10).map(p => 
                    `<tr><td>${p.name}</td><td>${p.qty}</td></tr>`
                ).join('');
                document.getElementById('topProducts').innerHTML = productsHtml;
                
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('lastUpdated').textContent = 'Error loading data';
            }
        }
        
        loadData();
    </script>
</body>
</html>
